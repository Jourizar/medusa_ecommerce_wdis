# Production stack for a single small VPS (4 GB RAM is plenty).
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). Postgres, Redis,
# Medusa and Next.js talk over the private compose network.

name: wdis

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [storefront, medusa]

  storefront:
    <<: *restart
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    image: wdis-storefront
    environment:
      # Server-side calls skip the public internet and go straight to Medusa.
      MEDUSA_INTERNAL_URL: http://medusa:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      medusa:
        condition: service_healthy
    mem_limit: 512m

  medusa:
    <<: *restart
    build:
      context: .
      dockerfile: apps/medusa-backend/Dockerfile
    image: wdis-medusa
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: https://api.${DOMAIN}
      STORE_CORS: https://${DOMAIN}
      ADMIN_CORS: https://api.${DOMAIN}
      AUTH_CORS: https://${DOMAIN},https://api.${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - medusa_static:/app/server/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot runs migrations; give it time.
      start_period: 120s
    mem_limit: 1536m

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    <<: *restart
    image: redis:7-alpine
    # Events, cache, workflows, locks — small. Cap memory so it can't grow
    # unbounded on a 4 GB box.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  medusa_static:
